server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite para upload de planilhas e arquivos OFX (50MB)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache de assets estáticos (Vite usa hash no nome)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* → container api:3001 (na rede interna Docker)
    location /api/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # SPA fallback — todas as rotas vão para index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não expor arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
