# ──────────────────────────────────────────────────────────────────────────────
# Stack Traefik — instalar UMA VEZ por servidor
#
# No Portainer: Stacks > Add Stack > Web Editor
#   Cole este arquivo, defina as variáveis abaixo e clique Deploy.
#
# Variáveis obrigatórias no Portainer:
#   ACME_EMAIL      E-mail para Let's Encrypt (ex: ti@empresa.com.br)
#   DASHBOARD_PASS  Senha do dashboard Traefik (hash bcrypt)
#                   Gere em: https://bcrypt-generator.com/ (cost 12)
#
# Variáveis opcionais:
#   TRAEFIK_NETWORK   (default: traefik_public)
# ──────────────────────────────────────────────────────────────────────────────

networks:
  traefik_public:
    name: ${TRAEFIK_NETWORK:-traefik_public}
    driver: bridge

volumes:
  letsencrypt:
    driver: local
    name: traefik_letsencrypt

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    networks:
      - traefik_public
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Socket do Docker (somente leitura)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificados Let's Encrypt (persistido)
      - letsencrypt:/letsencrypt
    command:
      # API / Dashboard
      - "--api.dashboard=true"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${TRAEFIK_NETWORK:-traefik_public}"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect global HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt (HTTP challenge)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL obrigatório}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Logs
      - "--log.level=WARN"
      - "--accesslog=false"
    labels:
      - "traefik.enable=true"
      # Dashboard — acessível em https://traefik.seudominio.com.br
      # Comente estas labels se não quiser expor o dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${TRAEFIK_DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
      # Basic auth — usuário: admin / senha: definida em DASHBOARD_PASS
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:${DASHBOARD_PASS:-$$2y$$12$$placeholder}"
